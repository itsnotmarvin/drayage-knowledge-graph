<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drayage · Evidence graph</title>
<style>
:root{color-scheme:light;--ink:#172f35;--muted:#566b70;--line:#ccd7d8;--paper:#f4f7f6;--accent:#096e61;--warn:#825112}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{padding:24px 30px;background:#173b40;color:#fff}h1{margin:0;font-size:29px;font-weight:600;letter-spacing:-1px}header p{margin:6px 0 0;color:#d4e6e4}small,.muted{color:var(--muted)}button,input,select{font:inherit}button,select,input{border:1px solid var(--line);border-radius:5px;padding:8px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--accent);background:#edf6f3}button:focus-visible,a:focus-visible{outline:3px solid #c68b20;outline-offset:2px}a{color:var(--accent)}.toolbar{padding:15px 30px;display:flex;gap:16px;align-items:end;flex-wrap:wrap;border-bottom:1px solid var(--line)}label{display:grid;gap:3px;font-size:13px}input{width:260px;max-width:100%}.stats{margin-left:auto;font-size:14px}main{display:grid;grid-template-columns:280px minmax(0,1fr) 370px;min-height:calc(100vh - 220px)}aside{padding:18px;border-right:1px solid var(--line);min-width:0}.catalog{max-height:75vh;overflow:auto}.node-item{display:block;text-align:left;width:100%;margin:0 0 6px;font-size:13px;background:transparent;border-color:transparent}.node-item[aria-pressed=true]{background:#dceee8;border-color:#7aa99c}.node-item small{display:block;font-size:11px}.stage{padding:20px;min-width:0}h2{font-size:19px;margin:0 0 10px}h3{font-size:14px;margin:20px 0 8px}#graph{width:100%;height:560px;display:block}#graph text{font:12px system-ui;fill:var(--ink)}#graph .edge{stroke:#9cafaF;fill:none;stroke-width:1.2}#graph .focus{fill:#175f56}#graph .peer{fill:#e5efe9;stroke:#759c90}#graph .quarantine{fill:#f9e8c8;stroke:#b28b4f}#graph g{cursor:pointer}#detail{border-left:1px solid var(--line);border-right:0;max-height:82vh;overflow:auto}#detail p{overflow-wrap:anywhere}.tag{display:inline-block;background:#e5eceb;padding:3px 7px;border-radius:3px;font-size:12px;margin:2px}.warning{color:var(--warn);background:#fbefd8;padding:10px;border-left:3px solid #b77d25;font-size:13px}.quote{border-left:3px solid #8ba9a2;padding:0 0 0 12px;white-space:pre-wrap;font-size:14px}.relation{display:block;width:100%;text-align:left;margin:5px 0;font-size:12px}.relation strong{display:block;color:var(--accent);font-size:11px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}details{margin:16px 0}summary{cursor:pointer}footer{padding:14px 30px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);overflow-wrap:anywhere}.empty{padding:20px 0;color:var(--muted)}#neighbors{max-height:280px;overflow:auto}#count{margin:0 0 10px;font-size:12px}#view-note{font-size:13px;color:var(--muted)}@media(max-width:1150px){main{grid-template-columns:240px minmax(0,1fr)}#detail{grid-column:1/-1;max-height:none;border-top:1px solid var(--line)}#graph{height:500px}}@media(max-width:650px){header,.toolbar,footer{padding:16px}main{display:block}aside{border-right:0}.catalog{max-height:230px}.stats{margin-left:0}.stage{padding:16px}#graph{height:420px}#detail{border-left:0}input{width:100%}.toolbar label{width:100%}}
</style>
<header><h1>Drayage evidence graph</h1><p>APM Elizabeth · Sources, requirements, authorities, and the last mile</p></header>
<div class="toolbar">
<label>Search every retained record<input id="search" type="search" placeholder="Try SeaLink, Port St., axle, or permit"></label>
<label>Record type<select id="kind"><option value="">All record types</option></select></label>
<button id="reset" type="button">Reset view</button>
<button id="overview" type="button" aria-pressed="false">Whole graph</button>
<span class="stats" id="stats"></span>
<a href="graph.json" download>JSON</a><a href="graph.graphml" download>GraphML</a>
</div>
<main>
<aside><p id="count" aria-live="polite"></p><div id="catalog" class="catalog"></div></aside>
<section class="stage"><h2 id="view-title">Connected evidence</h2><p id="view-note">Select a record to explore its incoming and outgoing relationships.</p><svg id="graph" role="img" aria-label="Selected record and its direct graph neighbors"></svg><h3>Relationships of selected record</h3><div id="neighbors"></div></section>
<aside id="detail" aria-live="polite"></aside>
</main>
<footer id="footer"></footer>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('graph-data').textContent);
const byId=new Map(data.nodes.map(n=>[n.id,n]));
const $=id=>document.getElementById(id);
let selected='facility_apm_elizabeth';
let overview=false;
const text=(tag,value,parent,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;if(parent)parent.append(e);return e;};
const human=value=>value.replaceAll('_',' ');
const allKinds=[...new Set(data.nodes.map(n=>n.kind))].sort();
allKinds.forEach(k=>{const e=text('option',human(k),$('kind'));e.value=k;});
$('stats').textContent=`${data.nodes.length} records · ${data.edges.length} relationships · ${data.summary.node_kinds.source_clause} clauses`;
$('footer').textContent=`Complete export of the retained graph inputs. Archived evidence; current trip eligibility is not established. ${data.verified_archive_files.length} archive files hash-verified at build time. Evidence version: ${data.summary.evidence_version}`;
function catalog(){
 const query=$('search').value.toLowerCase().trim(),kind=$('kind').value;
 const nodes=data.nodes.filter(n=>(!kind||n.kind===kind)&&(!query||JSON.stringify(n).toLowerCase().includes(query)));
 $('catalog').replaceChildren();$('count').textContent=`${nodes.length} of ${data.nodes.length} records`;
 nodes.forEach(n=>{const b=text('button',n.label,$('catalog'),'node-item');b.type='button';b.dataset.id=n.id;b.setAttribute('aria-pressed',String(n.id===selected));text('small',human(n.kind),b);b.onclick=()=>select(n.id);});
 if(!nodes.length)text('p','No matching records. Try a different term.',$('catalog'),'empty');
}
function relationButton(edge,parent){
 const incoming=edge.target===selected,other=byId.get(incoming?edge.source:edge.target);
 const b=text('button','',parent,'relation');b.type='button';b.dataset.edgeId=edge.id;
 text('strong',`${incoming?'INCOMING':'OUTGOING'} · ${edge.relationship}`,b);
 text('span',other.label,b);
 if(edge.record.sequence)text('span',` · segment ${edge.record.sequence}`,b);
 b.onclick=()=>select(other.id);
}
function details(node,edges){
 const panel=$('detail');panel.replaceChildren();text('h2',node.label,panel);
 text('span',human(node.kind),panel,'tag');text('span',human(node.layer),panel,'tag');
 const r=node.record;
 if(node.layer==='quarantined_observation')text('p','Dated observation · quarantined. Recheck before operational use; no active restriction relationships.',panel,'warning');
 if(r.graph_eligibility&&(r.graph_eligibility.startsWith('exclude')||r.graph_eligibility.includes('unresolved')))text('p',`Archive eligibility: ${human(r.graph_eligibility)}`,panel,'warning');
 ['interpretation_status','interpretation_boundary','named_blocker','currentness_limit','compliance_status'].forEach(k=>{if(r[k]){text('h3',human(k),panel);text('p',typeof r[k]==='string'?r[k]:JSON.stringify(r[k]),panel);}});
 if(r.source_text){text('h3','Retained source text',panel);text('div',Array.isArray(r.source_text)?r.source_text.join('\n\n'):r.source_text,panel,'quote');}
 if(r.source_locator)text('p',`Locator: ${r.source_locator}`,panel,'muted');
 const source=byId.get(r.source_id),sourceRecord=source?source.record:(node.kind==='source_document'?r:null);
 if(sourceRecord){text('h3','Source provenance',panel);text('p',sourceRecord.title,panel);text('p',`Publisher: ${sourceRecord.publisher}`,panel);
 ['publication_date','effective_date','accessed_date','observed_at'].forEach(k=>{if(sourceRecord[k])text('p',`${human(k)}: ${sourceRecord[k]}`,panel,'muted');});
 if(sourceRecord.url&&/^https?:\/\//i.test(sourceRecord.url)){const a=text('a','Open source website',panel);a.href=sourceRecord.url;a.target='_blank';a.rel='noopener noreferrer';}
 if(source){const b=text('button','Explore source record',panel);b.type='button';b.onclick=()=>select(source.id);}
 }
 const raw=text('details','',panel);text('summary','Complete retained record',raw);text('pre',JSON.stringify(r,null,2),raw);
 const edgeDetails=text('details','',panel);text('summary',`Relationship records (${edges.length})`,edgeDetails);text('pre',JSON.stringify(edges,null,2),edgeDetails);
 text('small',node.id,panel);
}
function draw(edges){
 if(overview)edges=data.edges;
 const svg=$('graph');svg.replaceChildren();const width=svg.clientWidth||600,height=svg.clientHeight||560;
 svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
 const ns='http://www.w3.org/2000/svg';
 function el(tag,attrs,parent=svg){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));parent.append(e);return e;}
 const defs=el('defs',{}),marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},defs);
 el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#758f89'},marker);
 const peers=(overview?data.nodes.map(n=>n.id):[...new Set(edges.flatMap(e=>[e.source,e.target]))]).filter(id=>id!==selected);
 const coords=new Map([[selected,{x:width/2,y:height/2}]]),rx=Math.max(45,width/2-95),ry=height/2-65;
 peers.forEach((id,i)=>{const angle=2*Math.PI*i/peers.length-Math.PI/2;coords.set(id,{x:width/2+rx*Math.cos(angle),y:height/2+ry*Math.sin(angle)});});
 if(overview){
  const entries=[...coords.entries()];
  for(let step=0;step<180;step++){
   const delta=new Map(entries.map(([id])=>[id,{x:0,y:0}]));
   for(let i=0;i<entries.length;i++)for(let j=i+1;j<entries.length;j++){
    const [ai,a]=entries[i],[bi,b]=entries[j],dx=a.x-b.x,dy=a.y-b.y,d2=Math.max(dx*dx+dy*dy,4),force=700/d2;
    delta.get(ai).x+=dx*force;delta.get(ai).y+=dy*force;delta.get(bi).x-=dx*force;delta.get(bi).y-=dy*force;
   }
   edges.forEach(e=>{const a=coords.get(e.source),b=coords.get(e.target),dx=b.x-a.x,dy=b.y-a.y;
    delta.get(e.source).x+=dx*.015;delta.get(e.source).y+=dy*.015;delta.get(e.target).x-=dx*.015;delta.get(e.target).y-=dy*.015;});
   entries.forEach(([id,p])=>{const d=delta.get(id),cool=1-step/200;p.x=Math.max(24,Math.min(width-24,p.x+Math.max(-8,Math.min(8,d.x+(width/2-p.x)*.006))*cool));p.y=Math.max(24,Math.min(height-24,p.y+Math.max(-8,Math.min(8,d.y+(height/2-p.y)*.006))*cool));});
  }
 }
 edges.forEach(e=>{const a=coords.get(e.source),b=coords.get(e.target),dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
 const line=el('line',{x1:a.x+dx/len*15,y1:a.y+dy/len*15,x2:b.x-dx/len*17,y2:b.y-dy/len*17,class:'edge','marker-end':'url(#arrow)'});el('title',{},line).textContent=e.relationship;});
 coords.forEach((p,id)=>{const n=byId.get(id),g=el('g',{'data-node-id':id});el('title',{},g).textContent=n.label;
 el('circle',{cx:p.x,cy:p.y,r:overview?(id===selected?10:6):(id===selected?17:11),class:id===selected?'focus':n.layer==='quarantined_observation'?'quarantine':'peer'},g);
 if(peers.length<19||id===selected){const label=n.label.length>24?n.label.slice(0,22)+'…':n.label;el('text',{x:p.x,y:p.y+31,'text-anchor':'middle'},g).textContent=label;}
 g.onclick=()=>{overview=false;$('overview').setAttribute('aria-pressed','false');select(id);};});
 $('view-note').textContent=overview?`${data.nodes.length} records · ${edges.length} relationships. Click a node to explore its neighborhood. Amber nodes are quarantined observations; disconnected records remain included.`:peers.length?`${peers.length} connected records · arrows show stored relationship direction. Full labels and relationship types are listed below.`:'This retained record has no stored relationships. Its full evidence remains available in the details panel.';
}
function select(id){selected=id;const node=byId.get(id),edges=data.edges.filter(e=>e.source===id||e.target===id);$('view-title').textContent=node.label;catalog();details(node,edges);$('neighbors').replaceChildren();edges.forEach(e=>relationButton(e,$('neighbors')));if(!edges.length)text('p','No stored relationships.',$('neighbors'),'empty');draw(edges);}
$('search').oninput=catalog;$('kind').onchange=catalog;
$('reset').onclick=()=>{$('search').value='';$('kind').value='';overview=false;$('overview').setAttribute('aria-pressed','false');select('facility_apm_elizabeth');};
$('overview').onclick=()=>{overview=!overview;$('overview').setAttribute('aria-pressed',String(overview));draw(data.edges.filter(e=>e.source===selected||e.target===selected));};
new ResizeObserver(()=>draw(data.edges.filter(e=>e.source===selected||e.target===selected))).observe($('graph'));
select(selected);
</script>
</html>
